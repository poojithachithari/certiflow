server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Live updates (Server-Sent Events): no buffering, long read timeout.
  location = /api/events {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 3m;
  }

  # Demo only: the stand-in WhatsApp provider's "phone inbox".
  location /mock-whatsapp/ {
    proxy_pass http://mock-whatsapp:4000/;
  }

  # Single-page app: unknown paths serve index.html (React Router handles them).
  location / {
    try_files $uri /index.html;
  }
}
